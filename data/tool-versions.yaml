  - tool: cuda
    upstream_checked_at: "2026-10-27"
    releases:
      - name: "13.3 Update 1"
        released_at: "2026-06-29"
        channel: stable
        release_notes_url: "https://docs.nvidia.com/cuda/cuda-toolkit-release-notes/"
        evidence_source_ids:
          - doc-cuda-13
        notes: |
          Current stable toolkit update at the 2026-08-18 audit cutoff. NVIDIA's
          Nsight Compute 2026.2.1 history identifies 2026-06-29 as the CUDA
          Toolkit 13.3 Update 1 release date.
      - name: "13.3"
        released_at: "2026-05-26"
        channel: stable
        release_notes_url: "https://docs.nvidia.com/cuda/cuda-toolkit-release-notes/"
        evidence_source_ids:
          - doc-cuda-13
          - doc-cutile-python-dsl
        notes: |
          Base 13.3 release. NVIDIA's announcement is dated 2026-05-26. CUDA
          Tile C++, CompileIQ, and CUDA Python 1.0 are release highlights.
      - name: "13.2"
        released_at: "2026-03-09"
        channel: stable
        release_notes_url: "https://developer.nvidia.com/blog/cuda-13-2-introduces-enhanced-cuda-tile-support-and-new-python-features/"
        evidence_source_ids:
          - doc-cutile-python-dsl
        notes: |
          NVIDIA's release announcement is dated 2026-03-09. It expanded CUDA
          Tile support and corresponds to cuTile Python 1.2-era features.
      - name: "13.1"
        released_at: "2025-12-04"
        channel: stable
        release_notes_url: "https://developer.nvidia.com/blog/nvidia-cuda-13-1-powers-next-gen-gpu-programming-with-nvidia-cuda-tile-and-performance-gains/"
        evidence_source_ids:
          - doc-cuda-13
          - doc-cutile-python-dsl
        notes: |
          Introduced cuTile Python DSL (see sources/docs/cutile-python-dsl.md).
          NVIDIA's announcement is dated 2025-12-04.
      - name: "13.0"
        released_at: "2025-08-04"
        channel: stable
        release_notes_url: "https://developer.nvidia.com/blog/whats-new-and-important-in-cuda-toolkit-13-0/"
        evidence_source_ids:
          - doc-cuda-13
        notes: |
          NVIDIA's CUDA 13.0 announcement is dated 2025-08-04.
      - name: "12.8"
        released_at: "2025-01-23"
        channel: stable
        release_notes_url: "https://docs.nvidia.com/cuda/archive/12.8.0/cuda-toolkit-release-notes/index.html"
        evidence_source_ids:
          - doc-cuda-13
          - pr-pytorch-150705
        notes: |
          First CUDA toolkit with full Blackwell/sm100 support. Required for
          PyTorch's vec128 vectorized loads (pr-pytorch-150705). NVIDIA's
          developer-tools archive lists 2025-01-23.
