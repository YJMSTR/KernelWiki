## Selected tool releases of record for the version-sensitive registry.
## Read by scripts/check_version_freshness.py and the validator's
## DEC-4 CUTLASS pinning rule (task5). Schema: data/schemas.yaml
## :: tool-versions-snapshot.
##
## This file is deterministic and offline. data/tool-release-receipt.yaml
## records the exact authoritative release-list receipt used to populate it;
## check_version_freshness.py requires the two files to agree. Validation does
## not claim to discover releases published after that dated receipt.
##
## "needs-verification" sentinels mark fields the current refresh
## round did not authoritatively pin; future refresh rounds should
## replace them. The validator (task5) does not reject
## needs-verification entries, but check_version_freshness.py
## flags them as advisory warnings.
##
## 2026-10-27 partial extension (Blackwell-scoped): triton and cutlass
## release rows re-receipted from the GitHub releases API (exact
## published_at timestamps); cuda re-checked on the toolkit release-notes
## and toolkit-archive pages, where 13.4.x is current but no exact GA or
## update dates are published — cuda therefore gains no new dated rows
## this round. CUDA 13.4 observation: archive page lists 13.4.3
## (October 2026) as Latest Release with 13.4.2 (September 2026)
## archived; Nsight Compute 2026.3.1.2 maps to CUDA 13.4; CUTLASS
## v4.8.0dev (2026-08-27) already requires the CUDA 13.4 GA / R615
## driver, bounding 13.4 GA at or before 2026-08-27.

tools:
  - tool: triton
    upstream_checked_at: "2026-10-27"
    releases:
      - name: "3.8.0"
        released_at: "2026-08-28"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.8.0"
        evidence_source_ids:
          - doc-triton-3.6-blackwell
        notes: |
          Current stable release at the 2026-10-27 recheck (GitHub
          published_at 2026-08-28T18:25:56Z). Blackwell-relevant items in
          the release notes: MMAv5 and scaled-dot additions, generic
          multi-CTA support extended to layout conversion, reductions,
          gather/scatter, TMA and multicast, tma.store_wait read_only
          argument, Gluon TMEM-copy predication and accumulator-release
          fixes, and loop unrolling for Gluon warp-pipelined kernels.
          Two-CTA tcgen05 MMA for tl.dot / dot_scaled was still landing
          on mainline after this release (PR #10676 merged 2026-10-26,
          #12436 open), so 3.8.0 itself does not yet ship user-visible
          two-CTA tl.dot. Initial Rubin (SM107) backend work also lands
          here (out of Blackwell scope). The Blackwell capability
          boundary remains anchored to the 3.6 introduction notes.
      - name: "3.7.1"
        released_at: "2026-06-18"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.7.1"
        evidence_source_ids:
          - doc-triton-3.6-blackwell
        notes: |
          Current stable release at the 2026-08-18 audit cutoff. GitHub's
          published_at timestamp is 2026-06-18T14:38:51Z. The Blackwell
          capability boundary remains anchored to the 3.6 introduction notes;
          3.7.1 was reviewed for continuity, not as a new provenance source.
      - name: "3.7.0"
        released_at: "2026-05-07"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.7.0"
        evidence_source_ids:
          - doc-triton-3.6-blackwell
        notes: |
          GitHub's published_at timestamp is 2026-05-07T22:19:06Z. Retained as
          a release-of-record between the 3.6 introduction and current 3.7.1.
      - name: "3.6.0"
        released_at: "2026-01-21"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.6.0"
        evidence_source_ids:
          - doc-triton-3.6-blackwell
          - pr-sglang-22079
          - pr-sglang-21019
        notes: |
          First Triton release with native Blackwell tcgen05 + TMEM lowering
          infrastructure. Strongest user-visible Blackwell paths: descriptor/TMA
          warp-specialized matmul, Gluon multi-CTA / 2CTA, tl.dot_scaled / block
          scaled. See data/triton-3.6-evidence.md for the per-pathway breakdown.
      - name: "3.5.1"
        released_at: "2025-11-12"
        channel: stable
        release_notes_url: "https://github.com/triton-lang/triton/releases/tag/v3.5.1"
        notes: |
          Last 3.5.x patch before the 3.6 Blackwell story. Pages with
          version_sensitive claims valid for ">=3.5,<3.6" should pin to this
          release.

  - tool: cutlass
    upstream_checked_at: "2026-10-27"
    releases:
      - name: "4.8.1"
        released_at: "2026-10-21"
        channel: stable
        release_notes_url: "https://github.com/NVIDIA/cutlass/releases/tag/v4.8.1"
        evidence_source_ids:
          - doc-cutlass-changelog-sm100
        notes: |
          Current stable release at the 2026-10-27 recheck (GitHub
          published_at 2026-10-21T09:49:16Z). Blackwell-relevant fixes:
          tensormap_replace keeps device-side TMA descriptor updates safe
          when shrunk below the original extent (possible illegal memory
          access on Blackwell), and cute.extern zero-argument type
          signature fixes.
      - name: "4.8.0"
        released_at: "2026-09-22"
        channel: stable
        release_notes_url: "https://github.com/NVIDIA/cutlass/releases/tag/v4.8.0"
        evidence_source_ids:
          - doc-cutlass-changelog-sm100
        notes: |
          GitHub published_at 2026-09-22T03:37:45Z. Blackwell-relevant
          items: CuTe DSL automatic CTA-V map inference, async atomic
          TMA reduce-store, opt-in TMEM ping-pong accumulator planning;
          new Blackwell CuTe-extension examples (dense and block-scaled
          GEMM, GQA decode attention, back-to-back GEMM, CLC-scheduler
          persistent GEMM); Operator API nvMatmulHeuristics-based
          ranking. This line also introduces initial Rubin (SM107)
          support (out of Blackwell scope but shipped in the same
          release).
      - name: "4.8.0dev"
        released_at: "2026-08-27"
        channel: dev
        dev_branch_sha: cdcf8d86daa9b417840fd99875a1b1af685d389d
